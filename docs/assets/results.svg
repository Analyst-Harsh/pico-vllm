<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <!-- Numbers from docs/EXPERIMENTS.md:
       "2026-11-11: static vs continuous batching (v9 B3)" (64 requests, 8 slots, 32 pages) and
       "2026-11-11: prefix caching on a shared system prompt (v9 B4)" (32 pages, cache off vs on).
       Hand-written; transparent background and mid-grey text for light and dark themes. -->
  <title id="t">pico-vllm results</title>
  <desc id="d">Continuous vs static batching: tokens per step 3.29 to 7.08, utilisation 41% to 89%, median TTFT 139 to 8 steps. Prefix caching: peak pages 27 to 13, prefill tokens 2,541 to 525.</desc>
  <text x="20" y="28" font-size="16" font-weight="600" fill="#8b949e">Continuous batching</text>
  <rect x="20" y="40" width="12" height="12" rx="2" fill="#8b949e"/>
  <text x="38" y="50" font-size="12" fill="#8b949e">static</text>
  <rect x="106" y="40" width="12" height="12" rx="2" fill="#2f81f7"/>
  <text x="124" y="50" font-size="12" fill="#8b949e">continuous</text>
  <text x="20" y="82" font-size="13" fill="#8b949e">tokens per step (higher is better)</text>
  <rect x="20" y="90" width="111" height="14" rx="3" fill="#8b949e"/>
  <text x="139" y="101.5" font-size="12" fill="#8b949e">3.29</text>
  <rect x="20" y="110" width="240" height="14" rx="3" fill="#2f81f7"/>
  <text x="268" y="121.5" font-size="12" fill="#8b949e" font-weight="600">7.08</text>
  <text x="20" y="150" font-size="13" fill="#8b949e">batch utilisation (higher is better)</text>
  <rect x="20" y="158" width="111" height="14" rx="3" fill="#8b949e"/>
  <text x="139" y="169.5" font-size="12" fill="#8b949e">41%</text>
  <rect x="20" y="178" width="240" height="14" rx="3" fill="#2f81f7"/>
  <text x="268" y="189.5" font-size="12" fill="#8b949e" font-weight="600">89%</text>
  <text x="20" y="218" font-size="13" fill="#8b949e">TTFT p50, steps (lower is better)</text>
  <rect x="20" y="226" width="240" height="14" rx="3" fill="#8b949e"/>
  <text x="268" y="237.5" font-size="12" fill="#8b949e">139</text>
  <rect x="20" y="246" width="14" height="14" rx="3" fill="#2f81f7"/>
  <text x="42" y="257.5" font-size="12" fill="#8b949e" font-weight="600">8</text>
  <text x="400" y="28" font-size="16" font-weight="600" fill="#8b949e">Prefix caching</text>
  <rect x="400" y="40" width="12" height="12" rx="2" fill="#8b949e"/>
  <text x="418" y="50" font-size="12" fill="#8b949e">off</text>
  <rect x="462" y="40" width="12" height="12" rx="2" fill="#2f81f7"/>
  <text x="480" y="50" font-size="12" fill="#8b949e">on</text>
  <text x="400" y="82" font-size="13" fill="#8b949e">peak KV pages (lower is better)</text>
  <rect x="400" y="90" width="240" height="14" rx="3" fill="#8b949e"/>
  <text x="648" y="101.5" font-size="12" fill="#8b949e">27</text>
  <rect x="400" y="110" width="116" height="14" rx="3" fill="#2f81f7"/>
  <text x="524" y="121.5" font-size="12" fill="#8b949e" font-weight="600">13</text>
  <text x="400" y="150" font-size="13" fill="#8b949e">prefill tokens computed (lower is better)</text>
  <rect x="400" y="158" width="240" height="14" rx="3" fill="#8b949e"/>
  <text x="648" y="169.5" font-size="12" fill="#8b949e">2,541</text>
  <rect x="400" y="178" width="50" height="14" rx="3" fill="#2f81f7"/>
  <text x="458" y="189.5" font-size="12" fill="#8b949e" font-weight="600">525</text>
  <text x="400" y="262" font-size="11" fill="#8b949e">Same seeded 64-request workloads, 8 slots, 32 pages.</text>
  <text x="400" y="278" font-size="11" fill="#8b949e">Measured in engine steps; see docs/EXPERIMENTS.md.</text>
</svg>
